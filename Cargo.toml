[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
# internal
dbcraft-core = { path = "crates/core" }
dbcraft-sql = { path = "crates/sql" }
dbcraft-model = { path = "crates/model" }
dbcraft-drivers = { path = "crates/drivers" }
dbcraft-engine = { path = "crates/engine" }
dbcraft-automation = { path = "crates/automation" }
dbcraft-ui-egui = { path = "crates/ui-egui" }

# external
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
directories = "6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
russh = { version = "0.64", default-features = false, features = ["ring", "flate2", "rsa"] }
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio", "tls-rustls-ring-webpki", "sqlite-bundled", "postgres", "mysql",
  "chrono", "uuid", "json", "rust_decimal",
] }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "persistence"] }
egui = "0.36"
egui_extras = "0.36"
rfd = "0.17"
egui-phosphor = "0.14"
egui_kittest = "0.36"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
